version: 2
updates:
  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "addin/upstream-urgent"
      - "deps"

  # Python deps from upstream pyproject.toml — security updates only.
  # Routine bumps come through upstream merges; we only override here when
  # upstream lags on a CVE.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    allow:
      - dependency-type: "direct"
    labels:
      - "addin/upstream-urgent"
      - "deps"
      - "security"
