# .github/workflows/upstream-sync-weekly.yml
# Per spec §2.3: weekly automated merge PR from upstream/main into main.
# Auto-mergeable if no conflicts; otherwise resolved manually.

name: upstream sync (weekly)

on:
  schedule:
    # Mondays at 03:00 UTC. Adjust if you'd rather see PRs at a different time.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addin main
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.ADDIN_SYNC_PAT }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "addin-sync-bot"
          git config user.email "sync@tanyewhong.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main

      - name: Update mirror branch
        run: |
          git checkout -B upstream upstream/main
          git push origin upstream --force-with-lease

      - name: Compute branch name and check for new commits
        id: probe
        run: |
          git checkout main
          BRANCH="addin/upstream-sync-$(date -u +%Y-%m-%d)"
          AHEAD=$(git rev-list --count HEAD..upstream/main)
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          if [[ "$AHEAD" -eq 0 ]]; then
            echo "Upstream is not ahead of main. Nothing to merge."
          fi

      - name: Create merge branch
        if: steps.probe.outputs.ahead != '0'
        run: |
          BRANCH="${{ steps.probe.outputs.branch }}"
          git checkout -b "$BRANCH"
          # Attempt the merge. If it fails, push the branch with the conflict
          # markers so a human can finish it.
          if ! git merge --no-edit upstream/main; then
            echo "Merge has conflicts; committing in-progress state for human review."
            git add -A
            git commit -m "WIP: merge upstream/main — conflicts present, please resolve" || true
          fi
          git push origin "$BRANCH"

      - name: Open PR
        if: steps.probe.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.ADDIN_SYNC_PAT }}
        run: |
          BRANCH="${{ steps.probe.outputs.branch }}"
          AHEAD="${{ steps.probe.outputs.ahead }}"
          gh pr create \
            --repo tanyewhong-creator/addin \
            --base main \
            --head "$BRANCH" \
            --title "addin/upstream-sync: weekly merge ($AHEAD upstream commits)" \
            --label addin/upstream-merge \
            --body "Automated weekly merge from upstream/main per spec §2.3. Brings in $AHEAD upstream commits. Review: CI green, no conflicts, upstream CHANGELOG.md auto-updated. Touch CHANGELOG-ADDIN.md only if overlay behavior changed." \
            || echo "PR may already exist — check existing PRs."
